<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<title>Nouveau mot de passe</title>
</head>
<body style="margin:0;padding:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f8;padding:40px 16px;">
<tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e3e6eb;border-radius:16px;overflow:hidden;">
  <tr>
    <td style="background:#101319;padding:28px 36px;">
      <img src="https://www.workie.ch/email-logo.png" width="134" height="36" alt="Workie" style="display:block;border:0;height:36px;width:auto;" />
    </td>
  </tr>
  <tr>
    <td style="padding:40px 36px 36px;">
      <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-0.02em;color:#101319;">Nouveau mot de passe</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.65;color:#5f6575;">Cliquez sur le bouton pour choisir un nouveau mot de passe. Le lien est valable une heure.</p>
      <table cellpadding="0" cellspacing="0" style="margin:28px 0 0;"><tr><td style="border-radius:11px;background:#4f3cc9;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:11px;">Choisir un mot de passe</a>
      </td></tr></table>
      <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#5f6575;">Vous n'avez rien demandé ? Ignorez ce courriel, votre mot de passe ne change pas.</p>
    </td>
  </tr>
  <tr>
    <td style="padding:22px 36px;border-top:1px solid #e3e6eb;">
      <p style="margin:0;font-size:12px;line-height:1.6;color:#5f6575;">
        Workie · Chercher du travail devient passionnant ·
        <a href="https://www.workie.ch/confidentialite" style="color:#5f6575;">Confidentialité</a>
      </p>
    </td>
  </tr>
</table>
</td></tr>
</table>
</body>
</html>
