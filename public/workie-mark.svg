<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 100" fill="currentColor" role="img" aria-label="Workie">
  <!-- Symbole Workie : deux plans d'une fiche qui s'ouvre.
       Le plan arrière fuit vers la gauche, le plan avant est plus proche,
       plus grand, et arrondi. Tracé en currentColor pour suivre le thème
       clair comme le thème sombre sans seconde version du fichier. -->
  <path d="M0 22.5 L20.4 9.3 L20.4 87.9 L0 77.9 Z"/>
  <rect x="29.4" y="28.6" width="40.6" height="83.4" rx="7" transform="skewY(-22.2)"/>
</svg>
