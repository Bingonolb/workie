# Synchronisation des offres d'emploi, chaque nuit.
#
# Lit le flux officiel de l'outil de recrutement de chaque entreprise
# (table sources_offres), ajoute les nouvelles offres, met à jour les
# modifiées, ferme les disparues. Le bilan s'affiche dans le résumé du run.
#
# Peut aussi se lancer à la main : onglet Actions → « Synchronisation des
# offres » → Run workflow.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: Synchronisation des offres

on:
  schedule:
    - cron: "0 4 * * *" # 4 h UTC, soit 5 h ou 6 h en Suisse
  workflow_dispatch:

concurrency:
  group: synchro-offres
  cancel-in-progress: false

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Synchroniser
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/synchro-offres.mjs | tee bilan.txt
      - name: Bilan
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bilan.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "pas de bilan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
